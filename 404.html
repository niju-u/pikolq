<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F3EDF7" />
<title>Pickleball Open Play</title>
<link rel="icon" href="/img/icons/favicon.ico?v=2" sizes="any" />
<link rel="icon" href="/img/icons/favicon.svg?v=2" type="image/svg+xml" />
<script>
  // GitHub Pages shows this page for any address that doesn't exist.
  // Shared-session links look like pikolq.run.place/ABC123: send those to the join box on the main page.
  (function () {
    var m = location.pathname.match(/^\/([A-Za-z0-9]{6})\/?$/);
    if (m) location.replace('/#join=' + m[1].toUpperCase());
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: #F3EDF7; color: #33283B; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 1.4rem; }
  p { margin: 0 0 18px; color: #5C4F69; }
  a { display: inline-block; padding: 10px 18px; background: #6F527F; color: #fff; text-decoration: none; font-weight: 700; border: 2px solid #3B2A47; box-shadow: 3px 3px 0 #3B2A47; }
  @media (prefers-color-scheme: dark) {
    body { background: #1A1321; color: #F3EDF7; }
    p { color: #C2B6CC; }
  }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This link doesn’t go anywhere. If it was a shared session, check the code.</p>
    <a href="/">Go to Pickleball Open Play</a>
  </main>
</body>
</html>
